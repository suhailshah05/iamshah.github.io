<style>

/* =========================================================
   IAMSHAH — COMPLETE SINGLE FILE WEBSITE
   HTML + CSS + JAVASCRIPT
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root{
    --bg:#050505;
    --bg-soft:#090909;
    --card:#0d0d0d;
    --card2:#111111;
    --text:#ffffff;
    --muted:#8d8d8d;
    --muted2:#5f5f5f;
    --line:rgba(255,255,255,.10);
    --line2:rgba(255,255,255,.17);
    --accent:#dfff45;
    --purple:#8d5cff;
    --green:#25D366;
    --max:1180px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    scroll-padding-top:90px;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:"DM Sans",sans-serif;
    overflow-x:hidden;
}

/* Noise */
body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.025;
    z-index:9999;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* Ambient lights */
body:after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(223,255,69,.035);
    filter:blur(120px);
    right:-250px;
    top:30%;
    pointer-events:none;
    z-index:-2;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font-family:inherit;
}

.container{
    width:min(var(--max),92%);
    margin:auto;
}

section{
    position:relative;
    padding:120px 0;
}

/* =========================================================
   LOADER
   ========================================================= */

.loader{
    position:fixed;
    inset:0;
    background:#050505;
    z-index:10000;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity .7s, visibility .7s;
}

.loader.hide{
    opacity:0;
    visibility:hidden;
}

.loader-inner{
    text-align:center;
}

.loader-logo{
    font-family:"Space Grotesk",sans-serif;
    font-size:42px;
    font-weight:700;
    letter-spacing:-3px;
}

.loader-logo span{
    color:var(--accent);
}

.loader-line{
    width:140px;
    height:2px;
    background:#222;
    margin:20px auto 0;
    overflow:hidden;
}

.loader-line:after{
    content:"";
    display:block;
    height:100%;
    width:50%;
    background:var(--accent);
    animation:loader 1.1s infinite ease-in-out;
}

@keyframes loader{
    0%{transform:translateX(-100%)}
    100%{transform:translateX(300%)}
}

/* =========================================================
   NAVBAR
   ========================================================= */

.navbar{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:76px;
    z-index:5000;
    background:rgba(5,5,5,.68);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid transparent;
    transition:.3s;
}

.navbar.scrolled{
    border-bottom-color:var(--line);
    background:rgba(5,5,5,.9);
}

.nav-inner{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-family:"Space Grotesk",sans-serif;
    font-size:24px;
    font-weight:700;
    letter-spacing:-1.5px;
}

.logo span{
    color:var(--accent);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:30px;
    list-style:none;
}

.nav-links a{
    position:relative;
    color:#999;
    font-size:12px;
    font-weight:600;
    transition:.3s;
}

.nav-links a:after{
    content:"";
    position:absolute;
    width:0;
    height:1px;
    left:0;
    bottom:-6px;
    background:var(--accent);
    transition:.3s;
}

.nav-links a:hover{
    color:#fff;
}

.nav-links a:hover:after{
    width:100%;
}

.nav-cta{
    border:1px solid var(--line2);
    padding:11px 18px;
    border-radius:50px;
    font-size:12px;
    font-weight:700;
    transition:.3s;
}

.nav-cta:hover{
    background:var(--accent);
    color:#050505;
    border-color:var(--accent);
}

.menu-btn{
    display:none;
    border:0;
    background:none;
    color:#fff;
    width:42px;
    height:42px;
    cursor:pointer;
    position:relative;
    z-index:6000;
}

.menu-icon{
    width:24px;
    height:18px;
    position:absolute;
    left:9px;
    top:12px;
}

.menu-icon span{
    position:absolute;
    width:100%;
    height:2px;
    background:#fff;
    left:0;
    transition:.3s;
}

.menu-icon span:nth-child(1){
    top:0;
}

.menu-icon span:nth-child(2){
    top:8px;
}

.menu-icon span:nth-child(3){
    top:16px;
}

.menu-btn.active .menu-icon span:nth-child(1){
    top:8px;
    transform:rotate(45deg);
}

.menu-btn.active .menu-icon span:nth-child(2){
    opacity:0;
}

.menu-btn.active .menu-icon span:nth-child(3){
    top:8px;
    transform:rotate(-45deg);
}

/* =========================================================
   HERO
   ========================================================= */

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    padding-top:150px;
    overflow:hidden;
}

.hero-grid{
    position:absolute;
    inset:0;
    opacity:.07;
    background-image:
        linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.4) 1px,transparent 1px);
    background-size:75px 75px;
    mask-image:linear-gradient(to bottom,#000,transparent 90%);
    -webkit-mask-image:linear-gradient(to bottom,#000,transparent 90%);
}

.hero-glow{
    position:absolute;
    width:600px;
    height:600px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(141,92,255,.13),transparent 65%);
    right:-180px;
    top:5%;
    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero-tag{
    display:inline-flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.025);
    border-radius:50px;
    padding:10px 16px;
    color:#aaa;
    font-size:12px;
    animation:fadeUp .8s both;
}

.live-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 15px var(--accent);
    animation:pulse 2s infinite;
}

.hero h1{
    font-family:"Space Grotesk",sans-serif;
    font-size:clamp(58px,9.5vw,125px);
    line-height:.84;
    letter-spacing:-7px;
    margin-top:30px;
    max-width:1100px;
    animation:fadeUp .9s .1s both;
}

.hero h1 .outline{
    color:transparent;
    -webkit-text-stroke:1px #686868;
}

.hero h1 .lime{
    color:var(--accent);
}

.hero-description{
    max-width:670px;
    color:#929292;
    line-height:1.85;
    font-size:15px;
    margin-top:38px;
    animation:fadeUp .9s .2s both;
}

.hero-description strong{
    color:#fff;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:32px;
    animation:fadeUp .9s .3s both;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    border-radius:50px;
    padding:15px 22px;
    border:1px solid var(--line2);
    font-size:12px;
    font-weight:700;
    transition:.35s;
    cursor:pointer;
}

.btn-primary{
    background:#fff;
    color:#000;
    border-color:#fff;
}

.btn-primary:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 45px rgba(255,255,255,.12);
}

.btn-secondary{
    color:#ddd;
}

.btn-secondary:hover{
    background:#fff;
    color:#000;
    transform:translateY(-4px);
}

.hero-stats{
    display:flex;
    gap:55px;
    margin-top:70px;
    animation:fadeUp 1s .4s both;
}

.stat-number{
    font-family:"Space Grotesk",sans-serif;
    font-size:32px;
    font-weight:700;
}

.stat-number span{
    color:var(--accent);
}

.stat-text{
    color:#5f5f5f;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-top:5px;
}

/* Floating shapes */
.hero-shape{
    position:absolute;
    pointer-events:none;
}

.shape-ring{
    width:500px;
    height:500px;
    right:-140px;
    top:22%;
    border:1px solid rgba(255,255,255,.07);
    border-radius:50%;
    animation:spin 25s linear infinite;
}

.shape-ring:before{
    content:"";
    position:absolute;
    width:8px;
    height:8px;
    background:var(--accent);
    border-radius:50%;
    top:50px;
    left:50px;
    box-shadow:0 0 25px var(--accent);
}

.shape-ring2{
    width:320px;
    height:320px;
    right:-50px;
    top:32%;
    border:1px dashed rgba(255,255,255,.08);
    border-radius:50%;
    animation:spinReverse 18s linear infinite;
}

.scroll-cue{
    position:absolute;
    bottom:30px;
    left:0;
    display:flex;
    align-items:center;
    gap:10px;
    color:#555;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:2px;
}

.scroll-cue span{
    width:1px;
    height:30px;
    background:var(--accent);
}

/* =========================================================
   MARQUEE
   ========================================================= */

.marquee{
    overflow:hidden;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:21px 0;
    white-space:nowrap;
}

.marquee-track{
    display:inline-flex;
    animation:marquee 28s linear infinite;
}

.marquee-item{
    display:flex;
    align-items:center;
    gap:25px;
    margin-right:25px;
    color:#707070;
    font-family:"Space Grotesk",sans-serif;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:2px;
}

.marquee-item b{
    color:var(--accent);
}

/* =========================================================
   SECTION COMMON
   ========================================================= */

.section-label{
    color:#666;
    font-size:10px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:18px;
}

.section-title{
    font-family:"Space Grotesk",sans-serif;
    font-size:clamp(40px,5vw,68px);
    line-height:.95;
    letter-spacing:-3px;
}

.section-title span{
    color:#777;
}

.section-description{
    max-width:650px;
    color:#777;
    line-height:1.8;
    font-size:13px;
}

/* =========================================================
   ABOUT
   ========================================================= */

.about-grid{
    display:grid;
    grid-template-columns:.85fr 1.4fr;
    gap:80px;
    align-items:start;
}

.about-card{
    min-height:380px;
    border:1px solid var(--line);
    border-radius:25px;
    padding:35px;
    background:
        radial-gradient(circle at 85% 10%,rgba(141,92,255,.13),transparent 30%),
        linear-gradient(145deg,#111,#080808);
    position:relative;
    overflow:hidden;
}

.about-card:after{
    content:"IAMSHAH";
    position:absolute;
    font-family:"Space Grotesk";
    font-size:75px;
    font-weight:700;
    color:rgba(255,255,255,.025);
    transform:rotate(-90deg);
    right:-100px;
    bottom:40px;
}

.about-logo{
    width:88px;
    height:88px;
    border:1px solid #303030;
    border-radius:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Space Grotesk";
    font-size:25px;
    font-weight:700;
    background:#0b0b0b;
    margin-bottom:80px;
}

.about-logo span{
    color:var(--accent);
}

.about-card h3{
    font-family:"Space Grotesk";
    font-size:27px;
    margin-bottom:10px;
}

.about-card p{
    color:#666;
    font-size:12px;
    line-height:1.7;
}

.about-content p{
    color:#8b8b8b;
    line-height:1.9;
    font-size:14px;
    margin-top:25px;
}

.about-content p strong{
    color:#fff;
}

.about-highlights{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:35px;
}

.highlight{
    padding:19px;
    border:1px solid var(--line);
    border-radius:15px;
    background:#0a0a0a;
    transition:.3s;
}

.highlight:hover{
    transform:translateY(-4px);
    border-color:#333;
}

.highlight strong{
    display:block;
    font-size:13px;
    margin-bottom:5px;
}

.highlight span{
    color:#606060;
    font-size:11px;
}

/* =========================================================
   SERVICES
   ========================================================= */

.services-heading{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:40px;
}

.services-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:55px;
}

.service-card{
    min-height:330px;
    border:1px solid var(--line);
    border-radius:22px;
    padding:30px;
    background:
        linear-gradient(145deg,#111,#090909);
    position:relative;
    overflow:hidden;
    transition:.4s;
}

.service-card:before{
    content:"";
    position:absolute;
    width:200px;
    height:200px;
    border-radius:50%;
    background:var(--purple);
    opacity:0;
    filter:blur(80px);
    right:-100px;
    top:-100px;
    transition:.4s;
}

.service-card:hover{
    transform:translateY(-7px);
    border-color:#333;
}

.service-card:hover:before{
    opacity:.2;
}

.service-number{
    color:#555;
    font-family:"Space Grotesk";
    font-size:11px;
    letter-spacing:2px;
}

.service-icon{
    width:50px;
    height:50px;
    border:1px solid #292929;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    margin-top:30px;
    background:#0a0a0a;
}

.service-card h3{
    font-family:"Space Grotesk";
    font-size:24px;
    letter-spacing:-1px;
    margin-top:20px;
    margin-bottom:12px;
}

.service-card p{
    color:#707070;
    font-size:12px;
    line-height:1.7;
    max-width:520px;
}

.service-list{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    list-style:none;
    margin-top:20px;
}

.service-list li{
    border:1px solid #242424;
    border-radius:50px;
    padding:6px 9px;
    color:#777;
    font-size:9px;
}

/* =========================================================
   SKILLS
   ========================================================= */

.skills-section{
    background:#080808;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
}

.skills-wrap{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
    margin-top:55px;
}

.skill-category{
    margin-bottom:28px;
}

.skill-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--line);
    padding-bottom:13px;
    margin-bottom:13px;
}

.skill-heading h4{
    font-family:"Space Grotesk";
    font-size:15px;
}

.skill-heading span{
    color:#555;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.skill-tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.skill-tag{
    padding:9px 12px;
    border:1px solid var(--line);
    background:#0c0c0c;
    border-radius:9px;
    color:#8b8b8b;
    font-size:10px;
    transition:.3s;
}

.skill-tag:hover{
    color:#050505;
    background:var(--accent);
    border-color:var(--accent);
    transform:translateY(-2px);
}

/* =========================================================
   EXPERIENCE
   ========================================================= */

.experience-box{
    border:1px solid var(--line);
    border-radius:25px;
    padding:50px;
    background:
        radial-gradient(circle at 20% 50%,rgba(223,255,69,.05),transparent 30%),
        #0c0c0c;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:50px;
    margin-top:50px;
}

.experience-number{
    font-family:"Space Grotesk";
    font-size:clamp(75px,10vw,125px);
    font-weight:700;
    line-height:.8;
    letter-spacing:-7px;
}

.experience-number span{
    color:var(--accent);
}

.experience-info{
    max-width:550px;
}

.experience-info h3{
    font-family:"Space Grotesk";
    font-size:28px;
    margin-bottom:15px;
}

.experience-info p{
    color:#707070;
    font-size:13px;
    line-height:1.8;
}

/* =========================================================
   WORKFLOW
   ========================================================= */

.workflow-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
    margin-top:50px;
}

.step{
    border:1px solid var(--line);
    border-radius:19px;
    padding:28px;
    background:#0b0b0b;
    min-height:230px;
    transition:.35s;
}

.step:hover{
    transform:translateY(-5px);
    border-color:#333;
}

.step-number{
    color:#555;
    font-family:"Space Grotesk";
    font-size:10px;
}

.step-icon{
    font-size:25px;
    margin-top:38px;
}

.step h3{
    font-family:"Space Grotesk";
    font-size:20px;
    margin-top:17px;
}

.step p{
    color:#666;
    font-size:11px;
    line-height:1.7;
    margin-top:9px;
}

/* =========================================================
   TOOLS
   ========================================================= */

.tools-section{
    padding-top:80px;
}

.tools{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:40px;
}

.tool{
    border:1px solid var(--line);
    border-radius:50px;
    padding:12px 16px;
    color:#888;
    font-size:11px;
    transition:.3s;
}

.tool:hover{
    color:#050505;
    background:var(--accent);
    border-color:var(--accent);
}

/* =========================================================
   DIGITAL PRODUCTS
   ========================================================= */

.products-section{
    background:
        radial-gradient(circle at 80% 30%,rgba(141,92,255,.07),transparent 35%);
}

.products-heading{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:30px;
}

.products-note{
    max-width:400px;
    color:#666;
    font-size:11px;
    line-height:1.7;
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-top:55px;
}

.product-card{
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
    background:#0c0c0c;
    transition:.4s;
}

.product-card:hover{
    transform:translateY(-7px);
    border-color:#383838;
}

.product-cover{
    height:210px;
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    background:
        radial-gradient(circle at 75% 25%,rgba(223,255,69,.17),transparent 25%),
        radial-gradient(circle at 25% 80%,rgba(141,92,255,.18),transparent 30%),
        #111;
}

.product-top{
    display:flex;
    justify-content:space-between;
    color:#777;
    font-size:9px;
    letter-spacing:2px;
}

.product-big{
    font-family:"Space Grotesk";
    font-size:55px;
    font-weight:700;
    letter-spacing:-5px;
}

.product-bottom-label{
    color:#777;
    font-size:9px;
    letter-spacing:2px;
}

.product-info{
    padding:22px;
}

.product-info h3{
    font-family:"Space Grotesk";
    font-size:20px;
    letter-spacing:-1px;
}

.product-info p{
    color:#666;
    font-size:11px;
    line-height:1.7;
    margin-top:10px;
    min-height:55px;
}

.product-purchase{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:20px;
}

.product-price{
    font-family:"Space Grotesk";
    font-size:20px;
    font-weight:700;
}

.buy-btn{
    background:var(--accent);
    color:#050505;
    border-radius:8px;
    padding:10px 13px;
    font-size:10px;
    font-weight:800;
    transition:.3s;
